<title>Storybook Escapes — Maintenance</title>
<script>
(function () {
  // Keep existing vendor, project-vendor and cleaner links on their original origin.
  const legacyView = /^#(?:v|pv|cv)\//.test(window.location.hash);
  const target = legacyView
    ? 'https://storybookescapes.github.io/maintenance/legacy-google.html'
    : 'https://storybook-webhook.vercel.app/maintenance/';
  window.location.replace(target + window.location.search + window.location.hash);
})();
</script>
</head>
<body>
<main>
<h1>Storybook Escapes Maintenance</h1>
<p>Opening the maintenance portal…</p>
<p><a href="https://storybook-webhook.vercel.app/maintenance/" rel="noreferrer">Open password sign-in</a></p>

</main>
</body>
</html>
